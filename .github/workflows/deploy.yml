name: Validar API y desplegar en Render

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Probar endpoints con PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: backendupb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/backendupb_test
      DB_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Crear tabla productos
        run: npm run db:init
      - name: Probar info, health y productos
        run: npm test
      - name: Probar endpoint HTTP para Postman
        run: |
          npm start > api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-connrefused http://localhost:3000/api/info --output respuesta-info.json
          node -e "const assert = require('node:assert/strict'); const info = require('./respuesta-info.json'); assert.equal(info.nombre, require('./package.json').name); assert.equal(info.mensaje, 'API funcionando correctamente');"
          echo '### GET /api/info - HTTP 200' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat respuesta-info.json >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar respuesta del endpoint
        uses: actions/upload-artifact@v4
        with:
          name: respuesta-endpoint-info
          path: respuesta-info.json
      - name: Resumen
        if: always()
        run: echo "Resultado de pruebas de la API con PostgreSQL - ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Solicitar despliegue en Render
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Comprobar hook
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo 'Falta configurar el secret RENDER_DEPLOY_HOOK_URL en GitHub.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Activar despliegue
        run: |
          if [[ "$RENDER_DEPLOY_HOOK_URL" == *\?* ]]; then
            separator='&'
          else
            separator='?'
          fi
          curl --fail --silent --show-error --output /dev/null --request POST "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${GITHUB_SHA}"
          echo "Render acepto el despliegue del commit validado ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"
      - name: Verificar backend publicado
        timeout-minutes: 7
        run: |
          curl --fail --silent --show-error --retry 30 --retry-delay 10 --retry-all-errors --retry-max-time 300 --max-time 20 https://backendupbtest-1.onrender.com/api/health --output health-publico.json
          node -e "const assert = require('node:assert/strict'); const health = require('./health-publico.json'); assert.equal(health.status, 'ok'); assert.equal(health.database, 'connected');"
          curl --fail --silent --show-error --max-time 30 https://backendupbtest-1.onrender.com/api/info --output info-publico.json
          node -e "const assert = require('node:assert/strict'); assert.equal(require('./info-publico.json').nombre, 'backendupb');"
          echo 'Backend publico verificado: /api/health y /api/info responden correctamente.' >> "$GITHUB_STEP_SUMMARY"
